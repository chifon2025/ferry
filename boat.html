<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102c35">
  <meta name="description" content="《渡》小舟試玩：調整方向，鬆手看看水流，再繼續前行。沒有分數與倒數。">
  <title>渡 · 小舟試玩</title>
  <link rel="icon" href="./icons/heartlight-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./boat.css">
  <script src="./boat-core.js" defer></script>
  <script src="./boat.js" defer></script>
  <script src="./pwa-update.js" defer></script>
</head>
<body>
<main class="voyage" id="voyage">
  <header><a href="./index.html" aria-label="回到渡的首頁">渡<span>小舟試玩</span></a><button id="menuOpen" aria-label="開啟功能" aria-haspopup="dialog">☰</button></header>
  <div class="intro"><h1 id="heading">往燈火那邊去</h1><p id="sceneStatus" role="status">左右調整方向，鬆手時隨水漂行。</p></div>
  <section id="river" class="river" aria-label="小舟與水流" aria-describedby="sceneStatus">
    <canvas id="flow" aria-hidden="true"></canvas>
    <div class="destination" aria-hidden="true"><span>渡口</span><i></i></div>
    <img class="skiff" id="skiff" src="./art/boat-skiff.webp" alt="你的小舟" draggable="false">
    <button class="begin" id="begin">出發</button>
    <div class="arrival" id="arrival" hidden><p>靠岸了</p><button id="again">再走一趟</button><a href="./index.html">先停在這裡</a></div>
  </section>
  <footer>
    <p class="control-caption" id="controlCaption">拇指拖動船舵，也可以按左右鍵</p>
    <div class="controls" id="controls">
      <button id="left" class="nudge" aria-label="向左划一下" disabled>←</button>
      <div id="helm" class="helm" role="slider" tabindex="0" aria-label="船舵" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0" aria-valuetext="隨水漂行" aria-disabled="true" aria-describedby="controlCaption"><span class="track"></span><span class="thumb" id="thumb" aria-hidden="true"></span></div>
      <button id="right" class="nudge" aria-label="向右划一下" disabled>→</button>
    </div>
    <p class="footnote">沒有倒數，隨時可以停下。</p>
  </footer>
</main>
<dialog id="menu" aria-labelledby="menuTitle">
  <div class="menu-head"><h2 id="menuTitle">停一會兒</h2><button id="menuClose" aria-label="關閉功能">×</button></div>
  <p>小舟已暫停。</p>
  <button id="sound" aria-pressed="false">配樂《回暖》：關</button>
  <label class="volume" for="volume">配樂音量<input id="volume" type="range" min="0" max="100" value="45"></label>
  <p id="audioStatus" role="status">沒有水聲、風聲或觸碰音。</p>
  <button id="install">安裝手機 App</button><p id="installStatus" role="status"></p>
  <button id="btnUpdate">檢查更新</button><p id="updateStatus" role="status">連線時自動檢查新版</p>
  <button id="resume">繼續這一趟</button>
  <a href="./index.html">回到原本的心燈</a>
</dialog>
<audio id="music" src="./music/heartlight-warm-strings.mp3" loop preload="none"></audio>
<noscript><p>請開啟 JavaScript 才能掌舵。<a href="./index.html">回到首頁</a></p></noscript>
</body>
</html>
