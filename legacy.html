<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#142d2c">
<meta name="description" content="《渡》——手機直式的水岸小遊戲。看見心裡想要的一刻，放一盞河燈，再回到眼前的生活。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="渡">
<title>渡｜河一直在流</title>
<meta property="og:title" content="渡｜河一直在流">
<meta property="og:description" content="看見一刻，放一盞燈，回到今天。免費、免帳號、手機直式的渡口日常。">
<meta property="og:url" content="https://chifon2025.github.io/ferry/">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="practice.css">
<link rel="stylesheet" href="river.css">
</head>
<body>
<a href="./" style="position:fixed;z-index:1000;bottom:12px;right:12px;padding:10px 16px;background:#f4ebdd;color:#354335;border-radius:24px;font:14px system-ui;text-decoration:none">回到心燈</a>

<!-- 水墨渡口場景 -->
<svg id="scene" viewBox="0 0 390 780" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <!-- 朱砂月 -->
  <circle id="moon" cx="308" cy="92" r="24" fill="#b6512f" opacity="0.26"/>

  <!-- 淡雲（極慢漂移） -->
  <g id="g-clouds" opacity="0.28">
    <path d="M60,120 q22,-16 52,-10 q18,-12 44,-4 q20,2 26,12 q-30,8 -62,6 q-38,4 -60,-4 Z" fill="#8a8f96"/>
    <path d="M210,180 q18,-12 42,-8 q16,-8 34,-2 q14,2 18,9 q-24,6 -48,5 q-30,3 -46,-4 Z" fill="#8a8f96" opacity="0.7"/>
  </g>

  <!-- 雁群（偶爾掠過） -->
  <g id="g-birds" stroke="#3a3f45" stroke-width="1.6" fill="none" opacity="0.55">
    <path d="M0,0 q5,-6 10,0 q5,-6 10,0"/>
    <path d="M22,10 q4,-5 8,0 q4,-5 8,0"/>
    <path d="M-16,14 q4,-5 8,0 q4,-5 8,0"/>
  </g>

  <!-- 遠山（淡墨層疊） -->
  <path d="M0,302 Q80,236 160,286 Q225,322 390,268 L390,345 L0,345 Z" fill="#4a5158" opacity="0.12"/>
  <path d="M0,322 Q120,262 212,306 Q300,340 390,302 L390,350 L0,350 Z" fill="#3a4148" opacity="0.10"/>
  <path d="M235,332 Q300,282 390,320 L390,352 L235,352 Z" fill="#3a4148" opacity="0.16"/>

  <!-- 河（留白為主，淡淡水痕） -->
  <rect x="0" y="340" width="390" height="212" fill="#93aab4" opacity="0.10"/>
  <g id="g-water">
    <path d="M46,412 q34,-7 72,0 q32,6 64,0" fill="none" stroke="#3f4a52" stroke-width="1.4" opacity="0.16"/>
    <path d="M180,470 q30,-6 62,0 q28,5 58,0" fill="none" stroke="#3f4a52" stroke-width="1.4" opacity="0.14"/>
    <path d="M70,510 q26,-5 54,0" fill="none" stroke="#3f4a52" stroke-width="1.2" opacity="0.12"/>
    <path d="M250,430 q22,-5 46,0" fill="none" stroke="#3f4a52" stroke-width="1.2" opacity="0.10"/>
  </g>

  <!-- 上游小舟（慕名而來的船家，後期出現） -->
  <g id="g-boat2" class="hidden-part" transform="translate(72,378) scale(0.5)">
    <path d="M-45,0 Q0,15 45,0 Q28,11 0,13 Q-28,11 -45,0 Z" fill="#2f2a26" opacity="0.7"/>
    <line x1="8" y1="-2" x2="20" y2="-34" stroke="#2f2a26" stroke-width="2.4" opacity="0.7"/>
  </g>

  <!-- 主舟 -->
  <g id="g-boat" transform="translate(140,458)">
    <g class="bob">
      <path d="M-48,0 Q0,17 48,0 Q30,11 0,13 Q-30,11 -48,0 Z" fill="#26221e"/>
      <circle cx="6" cy="-13" r="5" fill="#26221e"/>
      <path d="M6,-8 q-2,6 -1,9" stroke="#26221e" stroke-width="4" fill="none"/>
      <line x1="12" y1="-2" x2="30" y2="-48" stroke="#26221e" stroke-width="2.6"/>
    </g>
    <path d="M-40,16 q40,7 80,0" stroke="#26221e" stroke-width="1.2" fill="none" opacity="0.16"/>
  </g>

  <!-- 岸 -->
  <path d="M0,548 Q120,528 222,548 Q322,568 390,552 L390,780 L0,780 Z" fill="#2e3236" opacity="0.92"/>

  <!-- 棧橋 -->
  <polygon points="58,606 212,560 234,578 84,646" fill="#211c18"/>
  <line x1="212" y1="566" x2="212" y2="596" stroke="#211c18" stroke-width="5"/>
  <line x1="196" y1="572" x2="196" y2="600" stroke="#211c18" stroke-width="5"/>

  <!-- 茶棚（後期出現） -->
  <g id="g-teahouse" class="hidden-part" transform="translate(20,470)">
    <path d="M-4,32 L40,4 L84,32 Z" fill="#26221e"/>
    <line x1="6" y1="32" x2="6" y2="78" stroke="#26221e" stroke-width="4"/>
    <line x1="74" y1="32" x2="74" y2="78" stroke="#26221e" stroke-width="4"/>
    <line x1="0" y1="80" x2="80" y2="80" stroke="#26221e" stroke-width="4"/>
    <rect x="36" y="34" width="10" height="22" fill="#b6512f" opacity="0.85"/>
  </g>

  <!-- 燈（第一個變化） -->
  <g id="g-lamp" transform="translate(314,468)">
    <circle id="lampGlow" cx="-9" cy="30" r="42" fill="#e0a83f" opacity="0"/>
    <line x1="0" y1="150" x2="0" y2="18" stroke="#26221e" stroke-width="4"/>
    <path d="M0,18 q-12,2 -16,10" stroke="#26221e" stroke-width="3" fill="none"/>
    <rect id="lampBox" x="-15" y="26" width="11" height="15" rx="2" fill="#26221e"/>
  </g>

  <!-- 紅花（後期出現） -->
  <g id="g-flowers" class="hidden-part" transform="translate(252,580)">
    <path d="M2,16 q-1,-8 1,-14 M12,18 q0,-9 3,-15 M22,16 q1,-7 0,-13" stroke="#1e1b18" stroke-width="1.6" fill="none"/>
    <circle cx="3" cy="1" r="3" fill="#b6512f"/>
    <circle cx="15" cy="2" r="3.4" fill="#b6512f"/>
    <circle cx="22" cy="2" r="2.6" fill="#b6512f"/>
    <circle cx="9" cy="6" r="2.4" fill="#b6512f" opacity="0.8"/>
  </g>

  <!-- 問渡的旅人（有事相求時，走上棧橋） -->
  <g id="g-guest" class="hidden-part" transform="translate(206,560)">
    <circle cx="0" cy="-31" r="5.5" fill="#1e1b18"/>
    <path d="M-10,-34 q10,-8 20,0" stroke="#1e1b18" stroke-width="2.6" fill="none"/>
    <path d="M-7,0 Q-5,-25 0,-25 Q5,-25 7,0 Z" fill="#1e1b18"/>
    <line x1="10" y1="3" x2="10" y2="-38" stroke="#1e1b18" stroke-width="1.8"/>
  </g>

  <!-- 貓（後期出現） -->
  <g id="g-cat" class="hidden-part" transform="translate(150,588)">
    <ellipse cx="0" cy="0" rx="11" ry="6.5" fill="#17140f"/>
    <circle cx="11" cy="-6" r="4.6" fill="#17140f"/>
    <path d="M8,-9 l-1,-4 l3,2 Z M13,-10 l1,-4 l2,3 Z" fill="#17140f"/>
    <path d="M-10,1 q-8,-2 -7,-10" stroke="#17140f" stroke-width="2.4" fill="none"/>
  </g>

  <!-- 蘆葦 -->
  <g id="g-reeds" stroke="#17140f" stroke-width="1.8" fill="none" opacity="0.85">
    <path d="M28,712 q-2,-34 6,-52"/>
    <path d="M40,716 q2,-40 -4,-58"/>
    <path d="M52,714 q-1,-30 8,-46"/>
  </g>

  <!-- 朱印 -->
  <g transform="translate(338,714)">
    <rect x="0" y="0" width="26" height="26" rx="3" fill="#b6512f" opacity="0.9"/>
    <text x="13" y="19" text-anchor="middle" font-size="16" fill="#f4efe6" style="font-family:serif">渡</text>
  </g>
</svg>

<!-- 頂欄 -->
<header id="top">
  <span id="title">渡</span>
  <span id="dateLabel"></span>
</header>

<!-- 天色・天氣（水墨層次） -->
<div id="tint"></div>
<div id="mist"></div>
<div id="rain"></div>

<!-- 右上功能鍵：比照「主公我來了」，在故事途中也能操作 -->
<button id="btnMenu" class="btn small" aria-haspopup="dialog" aria-controls="functionPanel" aria-expanded="false">⚙ 功能</button>

<div id="functionPanel" class="hidden" role="dialog" aria-modal="true" aria-labelledby="functionTitle">
  <section class="function-sheet">
    <header class="function-head">
      <div><span class="practice-seal">渡口</span><h2 id="functionTitle">功能</h2></div>
      <button id="functionClose" class="function-close" aria-label="關閉功能面板">✕</button>
    </header>
    <div class="function-body">
      <button id="btnSound" class="function-option"></button>
      <details id="soundSettings" class="sound-settings">
        <summary>調整聲音</summary>
        <div class="sound-presets"><button id="soundNormal" aria-pressed="true">禪風琴音</button><button id="soundRiverOnly" aria-pressed="false">安靜模式</button></div>
        <label for="sound-music">禪風配樂<input id="sound-music" type="range" min="0" max="100" value="45"></label>
        <label for="sound-ambience">環境聲<input id="sound-ambience" type="range" min="0" max="100" value="70"></label>
        <label for="sound-effects">操作音效<input id="sound-effects" type="range" min="0" max="100" value="60"></label>
        <p id="soundStatus" role="status">持續水聲已關閉；環境聲僅保留微風與船木輕響。</p>
      </details>
      <button id="btnMenuInstall" class="function-option"></button>
      <button id="btnUpdate" class="function-option"><span class="function-icon">↻</span><span><b>檢查更新</b><small id="updateStatus" role="status">連線時自動檢查新版</small></span><strong>更新</strong></button>
    </div>
    <p class="function-note">遊戲進度會自動保存在這台裝置。</p>
  </section>
</div>

<!-- 今日隨身句 -->
<div id="carry" class="hidden"></div>

<!-- 場景即介面：今日事的提示與收工鈕 -->
<div id="sceneHint" class="hidden"></div>
<button id="sceneGo" class="btn hidden">今日事，畢</button>

<!-- 閒時底欄 -->
<nav id="idleBar" class="hidden">
  <button id="btnHelp" class="btn small help">渡我一下</button>
  <button id="btnRound" class="btn main"></button>
  <div class="row">
    <button id="btnQuotes" class="btn small">字帖</button>
    <button id="btnMail" class="btn small">信匣<span id="mailDot" class="dot hidden"></span></button>
    <button id="btnScroll" class="btn small">長卷</button>
    <button id="btnSet" class="btn small ghost">…</button>
  </div>
</nav>

<!-- 卡片層 -->
<div id="overlay" class="hidden"></div>

<!-- 霧 -->
<div id="fog"></div>

<!-- 收尾暗幕 -->
<div id="dusk"></div>

<script src="data.js"></script>
<script src="sound-core.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
<script src="practice-data.js"></script>
<script src="practice-core.js"></script>
<script src="river-core.js"></script>
<script src="river.js"></script>
<script src="practice.js"></script>
<noscript><div class="practice-nojs">《渡》需要啟用 JavaScript 才能遊玩。這是免帳號的靜態遊戲，存檔只保留在你的瀏覽器。</div></noscript>
<script src="pwa-update.js"></script>
</body>
</html>
